model_name: Qwen/Qwen2.5-7B-Instruct
output_dir: outputs/nova-edu-7b-sft

data:
  train_file: data/sft/build/train.jsonl
  val_file: data/sft/build/val.jsonl
  max_seq_length: 4096

lora:
  r: 16
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  precision: qlora_4bit
  epochs: 2
  learning_rate: 2.0e-4
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler: cosine
  logging_steps: 10
  save_strategy: epoch
  seed: 42

notes:
  - Best for fast iteration on a single consumer GPU
  - Use as smoke-test before 14B runs
